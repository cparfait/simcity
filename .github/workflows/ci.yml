name: CI

on:
  push:
  pull_request:
  # Hebdomadaire : vérifie que l'image se reconstruit toujours avec les
  # derniers correctifs Debian (job « docker »), sans attendre un commit.
  schedule:
    - cron: '0 5 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, ldap, mbstring

      - name: Compilation (syntaxe)
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | while IFS= read -r -d '' f; do
            php -l "$f"
          done

      - name: Test unitaire du parseur de factures
        run: php tests/invoice_parse_test.php

      - name: Test unitaire de l'import depuis SFR (lecteur xlsx, contrôles)
        run: php tests/parc_import_test.php

      - name: Test unitaire de l'archivage des fichiers et du rapprochement
        run: php tests/files_backup_test.php

      - name: Test unitaire de l'API chatIA (clé, adresses, liste blanche des données)
        run: php tests/api_test.php

      - name: Bibliothèques front-end (vendor.lock.json + paquets npm officiels)
        run: php tests/vendor_test.php --upstream

      - name: Test de démarrage (smoke test)
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ""
          DB_NAME: simcity_ci
          APP_DEBUG: "true"
        run: |
          php -S 127.0.0.1:8123 >/tmp/server.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8123/index.php | grep -q "Connexion – SimCity" \
            || { echo "La page de connexion ne répond pas :"; cat /tmp/server.log; exit 1; }

      - name: Test de recette (tests/smoke.sh)
        env:
          BASE_URL: http://127.0.0.1:8123/index.php
          ADMIN_USER: admin
          ADMIN_PASS: admin
        run: echo "oui" | bash tests/smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même commande que la procédure de mise à jour du README : image de
      # base re-tirée, aucune couche en cache, correctifs Debian appliqués.
      - name: Construction de l'image (--pull --no-cache)
        run: docker build --pull --no-cache -t simcity:ci .

      - name: Contrôle de l'image (extensions PHP, pdftotext, fichiers exclus)
        run: |
          set -e
          docker run --rm simcity:ci php -m | grep -qx ldap
          docker run --rm simcity:ci php -m | grep -qx pdo_mysql
          docker run --rm simcity:ci pdftotext -v
          docker run --rm simcity:ci sh -c 'test -f .htaccess && test ! -e tests && test ! -e vendor.lock.json'
